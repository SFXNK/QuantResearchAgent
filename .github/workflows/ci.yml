name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type-aware lint)
        run: uv run mypy src || true

      - name: Pytest (incl. integrity suite)
        run: uv run pytest

      - name: Smoke research run (offline echo model, deterministic)
        run: uv run alphaforge research --experiments 2 --model echo --seed 7

  native:
    name: Build C++ sim core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Configure
        run: cmake -S sim_core -B sim_core/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build sim_core/build -j

      - name: Native parity test
        run: |
          uv sync --extra dev
          cp sim_core/build/*.so src/alphaforge/sim/ || true
          uv run pytest tests/test_sim_parity.py
