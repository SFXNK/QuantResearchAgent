[project]
name = "quant-research-agent"
version = "0.1.0"
description = "An autonomous quant-research agent harness with a C++ market-sim core and a leakage-resistant evaluation protocol."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jason (Zhanhao) Zhao" }]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "websockets>=16.0",
]

[project.optional-dependencies]
sandbox = ["docker>=7.1"]
native = ["nanobind>=2.0", "scikit-build-core>=0.9"]
dev = [
    "nanobind>=2.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests>=2.32",
]

[project.scripts]
qra = "quant_research_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Generated artifacts and vendored code are not project source.
extend-exclude = ["runs", "external", "sim_core/build"]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]  # line width is handled by `ruff format`
# Enable import sorting + bugbear locally with `ruff check --select I,B`.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
